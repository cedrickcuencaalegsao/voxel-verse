[package]
name = "voxel-verse"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17", features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_pbr",
    "bevy_winit",
    "bevy_window",
    "png",
] }
noise = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rayon = "1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
